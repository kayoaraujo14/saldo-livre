version: 2
updates:
  # 1. Ecossistema Web (npm / React / Vite)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "oxlint"
          - "vitest*"
          - "@testing-library/*"
      production-dependencies:
        patterns:
          - "lucide-react"
          - "clsx"
          - "tailwind-merge"

  # 2. Ecossistema Android (Gradle / Kotlin / Jetpack Compose)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    ignore:
      # Não permitir updates 'major' automáticos de ferramentas base do Android,
      # que exigem migração coordenada de compilador e plugins
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.core:core-ktx"
        update-types: ["version-update:semver-major"]
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
          - "androidx.lifecycle*"
          - "androidx.navigation*"
      firebase:
        patterns:
          - "com.google.firebase*"

  # 3. Ecossistema Backend Serverless (npm / TypeScript / Cloud Functions)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    groups:
      backend-deps:
        patterns:
          - "*"

  # 4. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
