version: 2
updates:
  # 1. Ecossistema Web (npm / React / Vite)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "oxlint"
          - "vitest*"
          - "@testing-library/*"
      production-dependencies:
        patterns:
          - "lucide-react"
          - "clsx"
          - "tailwind-merge"

  # 2. Ecossistema Android (Gradle / Kotlin / Jetpack Compose)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    ignore:
      # Não permitir updates automáticos não-coordenados que quebram paridade de compilador
      # ou exigem bump de compileSdk 34 para 35 e Kotlin 1.9.23 para 2.0+
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.*"
      - dependency-name: "androidx.compose:compose-bom"
      - dependency-name: "androidx.compose.compiler:*"
      - dependency-name: "androidx.navigation:navigation-compose"
      - dependency-name: "androidx.fragment:fragment-ktx"
      - dependency-name: "androidx.biometric:biometric-ktx"
      - dependency-name: "androidx.activity:activity-compose"
      - dependency-name: "androidx.core:core-ktx"
        update-types: ["version-update:semver-major"]
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
          - "androidx.lifecycle*"
          - "androidx.navigation*"
      firebase:
        patterns:
          - "com.google.firebase*"

  # 3. Ecossistema Backend Serverless (npm / TypeScript / Cloud Functions)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-functions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      backend-deps:
        patterns:
          - "*"
