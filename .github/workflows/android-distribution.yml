name: Android CI/CD & Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build, Test & Distribute Android (APK / AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Distribution Secrets
        id: check-secrets
        env:
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_CREDS: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          PLAY_CREDS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FB_APP_ID" ] && [ -n "$FB_CREDS" ]; then
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
            echo "Secrets do Firebase App Distribution identificados."
          else
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
            echo "Secrets do Firebase App Distribution ausentes. Etapa de distribuição será ignorada."
          fi
          if [ -n "$PLAY_CREDS" ]; then
            echo "has_play=true" >> "$GITHUB_OUTPUT"
            echo "Secrets da Google Play Store identificados."
          else
            echo "has_play=false" >> "$GITHUB_OUTPUT"
            echo "Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente. Etapa da Play Store será ignorada."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Inject google-services.json
        working-directory: ./android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$GITHUB_WORKSPACE/android/app/google-services.json"
            echo "google-services.json gerado a partir do GitHub Secret."
          else
            cp "$GITHUB_WORKSPACE/android/app/google-services.json.example" "$GITHUB_WORKSPACE/android/app/google-services.json"
            echo "Secret GOOGLE_SERVICES_JSON ausente. Usando google-services.json.example como fallback."
          fi

      - name: Inject GEMINI_API_KEY into local.properties
        working-directory: ./android
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> "$GITHUB_WORKSPACE/android/local.properties"

      - name: Validate Release Signing Secrets
        id: check-signing
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/keystore.jks"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Keystore de Release decodificada em android/app/keystore.jks."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de assinatura de Release (KEYSTORE_BASE64, etc.) ausentes. Será compilado APK de Debug para validação contínua."
          fi

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Run Unit Tests (QA)
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Signed Release APK & App Bundle (AAB)
        if: ${{ steps.check-signing.outputs.has_signing == 'true' }}
        working-directory: ./android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Build Debug APK (QA Fallback)
        if: ${{ steps.check-signing.outputs.has_signing != 'true' }}
        working-directory: ./android
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK Artifact
        if: ${{ steps.check-signing.outputs.has_signing == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: saldo-livre-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        if: ${{ steps.check-signing.outputs.has_signing != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: saldo-livre-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Artifact
        if: ${{ steps.check-signing.outputs.has_signing == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: saldo-livre-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Distribute APK to Firebase App Distribution
        if: ${{ steps.check-secrets.outputs.has_firebase == 'true' && steps.check-signing.outputs.has_signing == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: qa-team
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            Build automático da branch ${{ github.ref_name }} (Commit: ${{ github.sha }})

      - name: Upload AAB to Google Play Store (Internal Track)
        if: ${{ steps.check-secrets.outputs.has_play == 'true' && steps.check-signing.outputs.has_signing == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.saldolivre.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
