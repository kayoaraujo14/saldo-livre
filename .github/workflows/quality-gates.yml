name: Monorepo Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/quality-gates.yml'
            android:
              - 'android/**'
              - '.github/workflows/quality-gates.yml'
            backend:
              - 'backend/**'
              - 'firebase.json'
              - '.github/workflows/quality-gates.yml'

  web-quality:
    name: Web QA (Lint, Vitest & Build)
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: npm --prefix web install

      - name: Run Linter (Oxlint)
        run: npm --prefix web run lint

      - name: Run Unit Tests (Vitest)
        run: npm --prefix web test -- --run

      - name: Verify Web Production Build
        run: npm --prefix web run build
        env:
          VITE_FIREBASE_API_KEY: "dummy-key-for-pr-build"
          VITE_FIREBASE_AUTH_DOMAIN: "saldo-livre-c3ca3.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "saldo-livre-c3ca3"

  android-quality:
    name: Android QA (Unit Tests & Kotlin Compile)
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Mock google-services.json
        run: |
          cp -f "$GITHUB_WORKSPACE/android/app/google-services.json.example" "$GITHUB_WORKSPACE/android/app/google-services.json"
          echo "GEMINI_API_KEY=dummy_ci_key" >> "$GITHUB_WORKSPACE/android/local.properties"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests (JVM)
        run: ./gradlew testDebugUnitTest --stacktrace

  backend-quality:
    name: Backend Serverless QA (TypeScript Build)
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Verify Backend TypeScript Build
        run: npm --prefix backend run build

  quality-gates-status:
    name: Quality Gates Final Status
    needs: [detect-changes, web-quality, android-quality, backend-quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Quality Gates
        run: |
          WEB_RES="${{ needs.web-quality.result }}"
          ANDROID_RES="${{ needs.android-quality.result }}"
          BACKEND_RES="${{ needs.backend-quality.result }}"

          echo "Web Quality: $WEB_RES"
          echo "Android Quality: $ANDROID_RES"
          echo "Backend Quality: $BACKEND_RES"

          if [ "$WEB_RES" = "failure" ] || [ "$ANDROID_RES" = "failure" ] || [ "$BACKEND_RES" = "failure" ]; then
            echo "❌ Pelo menos uma das etapas de qualidade falhou."
            exit 1
          fi

          echo "✅ Todos os subsistemas alterados passaram com sucesso nos quality gates."
