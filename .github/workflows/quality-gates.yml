name: Monorepo Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-quality:
    name: Web QA (Lint, Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: npm --prefix web install

      - name: Run Linter (Oxlint)
        run: npm --prefix web run lint

      - name: Run Unit Tests (Vitest)
        run: npm --prefix web test -- --run

      - name: Verify Web Production Build
        run: npm --prefix web run build
        env:
          VITE_FIREBASE_API_KEY: "dummy-key-for-pr-build"
          VITE_FIREBASE_AUTH_DOMAIN: "saldo-livre-c3ca3.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "saldo-livre-c3ca3"

  android-quality:
    name: Android QA (Unit Tests & Kotlin Compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Mock google-services.json
        run: |
          cp "$GITHUB_WORKSPACE/android/app/google-services.json.example" "$GITHUB_WORKSPACE/android/app/google-services.json"
          echo "GEMINI_API_KEY=dummy_ci_key" >> "$GITHUB_WORKSPACE/android/local.properties"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests (JVM)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify Android Kotlin Compilation
        run: ./gradlew compileDebugKotlin --stacktrace

  backend-quality:
    name: Backend Serverless QA (TypeScript Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Verify Backend TypeScript Build
        run: npm --prefix backend run build

