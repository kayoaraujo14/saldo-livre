# Criação automática de Preview Channel no Firebase Hosting em Pull Requests com Quality Gate
name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  test_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Instalar dependências
        run: npm --prefix web install

      - name: Executar Linter (Oxlint)
        run: npm --prefix web run lint

      - name: Executar Testes Unitários (Vitest - 79 testes)
        run: npm --prefix web test -- --run

      - name: Construir aplicação (Build)
        run: npm --prefix web run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'dummy-key-for-pr-build' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'saldo-livre-c3ca3.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'saldo-livre-c3ca3' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'saldo-livre-c3ca3.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || 'dummy-sender-id' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || 'dummy-app-id' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'dummy-gemini-key' }}

      - name: Deploy Preview no Firebase Hosting
        if: ${{ github.actor != 'dependabot[bot]' && secrets.FIREBASE_SERVICE_ACCOUNT_SALDO_LIVRE_C3CA3 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALDO_LIVRE_C3CA3 }}
          projectId: saldo-livre-c3ca3
