name: Android Release & Firebase App Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build Signed APK & Distribute to QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare google-services.json
        working-directory: ./android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$GITHUB_WORKSPACE/android/app/google-services.json"
          elif [ ! -f "$GITHUB_WORKSPACE/android/app/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/android/app/google-services.json.example" "$GITHUB_WORKSPACE/android/app/google-services.json"
          fi

      - name: Decode Signing Keystore
        working-directory: ./android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/keystore.jks"

      - name: Grant Execute Permission to Gradlew
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/keystore.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Distribute APK via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: qa-team
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Release automática gerada a partir do commit ${{ github.sha }} na branch ${{ github.ref_name }}."
